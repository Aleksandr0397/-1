[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moex-paper-bot"
version = "0.1.0"
description = "MOEX strategy backtesting and T-Invest sandbox trading"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
moex-bot = "moex_bot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["moex_bot*"]
